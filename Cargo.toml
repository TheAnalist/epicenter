[package]
name = "epicenter-cli"
version = "0.0.6"
edition = "2024"
rust-version = "1.91"
description = "The state layer for Cargo builds: shared cache, durable vault, per-job dirs"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["cargo", "build-cache", "compilation", "vault", "cli"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]
exclude = ["src/benchmark.rs", ".gitignore"]
repository = "https://github.com/TheAnalist/epicenter"

[[bin]]
name = "epicenter"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
