[package]
name = "epicenter-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "The state layer for Cargo builds: shared cache, durable vault, per-job dirs"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["cargo", "build-cache", "compilation", "vault", "cli"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]
exclude = [".gitignore"]
repository = "https://github.com/TheAnalist/epicenter"

[[bin]]
name = "epicenter"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
libc = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
toml = "0.8"
toml_edit = "0.22"
walkdir = "2"
ed25519-dalek = "2"
rustls-native-certs = "0.8.5"
rustls-pemfile = "2.2.0"
hmac = "0.12"
url = "2.5.9"
time = { version = "0.3.55", features = ["formatting"] }

[target.'cfg(unix)'.dependencies]
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
ureq = { version = "3.5.2", default-features = false, features = ["native-tls"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
lto = "thin"
incremental = true
